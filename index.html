<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="./hivemq-favicon.svg" />
        <link rel="stylesheet" href="./style.css" />
        <!--  <link rel="preload" href="./resources/tiles.json" as="fetch">-->

        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="A silly bingo card generator for HiveMQ meetings and Slack"
        />
        <meta name="author" content="HiveMQ" />
        <title>HiveMQ Bingo!!!</title>
      <script type="module" crossorigin src="./assets/index-CFT6hqle.js"></script>
    </head>
    <body>

        <div class="header">
            <img src="./hivemq-logo.svg" alt="HiveMQ" class="header-logo" />
            <span class="header-title">Bingo</span>
        </div>

        <div class="outer" id="outerCard">
            <div class="inner">
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
        </div>

        <div class="button-container">
            <button id="download">Download Card &#x2913;</button>
            <button id="copy">Copy to Clipboard &#x1F5D0;</button>
        </div>
        <div class="refresh-container">
            <button id="generateNewCard">Generate New Card &#10227;</button>
        </div>

        <div class="description">
            <p>
                <strong>HiveMQ Bingo</strong> is a silly thing made for a laugh.
            </p>
            <p>
                Card generated will be stored locally for three hours. Use the
                above button to generate a new bingo card
            </p>
            <p>
                Not an official HiveMQ product. Forked from
                <a href="https://github.com/johnholloway77/oxideBingo">OxideBingo</a>.
            </p>
        </div>
    </body>
</html>
